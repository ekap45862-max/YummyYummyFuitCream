<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkout | Yummy Yummy Fruit Cream</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;padding:25px 15px;background:#fff7fa;color:#49343d;font-family:Poppins,Arial,sans-serif}main{max-width:760px;margin:20px auto;background:#fff;padding:28px;border-radius:18px;box-shadow:0 5px 25px #eacbd533}.back{color:#c84d7c;text-decoration:none}h1,h2{color:#c84d7c}.summary{background:#fff7fa;border-radius:12px;padding:18px;margin:20px 0}.line{display:flex;justify-content:space-between;gap:12px;margin:12px 0}label{display:block;margin:16px 0 7px}input,textarea,select{width:100%;padding:12px;border:1px solid #edcbd9;border-radius:9px;font:inherit}textarea{resize:vertical}button{width:100%;padding:15px;margin-top:22px;border:0;border-radius:10px;background:#d85c8b;color:#fff;font-size:16px;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.note{font-size:13px;color:#806b74;line-height:1.6}</style></head>
<body><main><a class="back" href="cart.html">← Kembali ke keranjang</a><h1>Checkout 🍦</h1><p>Lengkapi data berikut untuk pesananmu.</p><section class="summary"><h2>Ringkasan Pesanan</h2><div id="orderItems"></div><hr><div class="line"><strong>Total Pembayaran</strong><strong id="total">Rp0</strong></div></section>
<form id="checkoutForm"><label for="customer">Nama lengkap</label><input id="customer" name="customer" autocomplete="name" required><label for="phone">Nomor WhatsApp</label><input id="phone" name="phone" type="tel" autocomplete="tel" required><label for="address">Alamat pengiriman</label><textarea id="address" name="address" rows="3" autocomplete="street-address" required></textarea><label for="payment">Metode pembayaran</label><select id="payment" name="payment" required><option value="">Pilih metode pembayaran</option><option value="Transfer bank">Transfer bank</option><option value="E-wallet">E-wallet</option><option value="COD">COD (jika tersedia)</option></select><p class="note">Catatan: checkout ini masih versi demo. Metode pembayaran belum memproses transaksi otomatis, dan pesanan hanya disimpan di browser ini.</p><button id="submitOrder" type="submit">Buat Pesanan</button></form></main>
<script>
const rupiah=n=>'Rp '+Number(n).toLocaleString('id-ID');function getCart(){try{const x=JSON.parse(localStorage.getItem('cart')||'[]');return Array.isArray(x)?x:[]}catch(e){return []}}
const cart=getCart(),box=document.getElementById('orderItems');const total=cart.reduce((s,i)=>s+(Number(i.price)||0)*Math.max(1,Number(i.quantity)||1),0);if(!cart.length){box.innerHTML='<p>Keranjang masih kosong. <a href="index.html">Belanja dulu</a>.</p>';document.getElementById('submitOrder').disabled=true}else{cart.forEach(item=>{const row=document.createElement('div');row.className='line';const name=document.createElement('span');name.textContent=`${item.name} × ${item.quantity}`;const price=document.createElement('strong');price.textContent=rupiah((Number(item.price)||0)*(Number(item.quantity)||1));row.append(name,price);box.appendChild(row)})}document.getElementById('total').textContent=rupiah(total);
document.getElementById('checkoutForm').addEventListener('submit',function(e){e.preventDefault();if(!cart.length){alert('Keranjang masih kosong.');return}const order={orderId:'YYFC-'+Date.now(),customer:document.getElementById('customer').value.trim(),phone:document.getElementById('phone').value.trim(),address:document.getElementById('address').value.trim(),payment:document.getElementById('payment').value,items:cart,total,date:new Date().toISOString(),status:'Menunggu konfirmasi'};let history=[];try{history=JSON.parse(localStorage.getItem('orderHistory')||'[]');if(!Array.isArray(history))history=[]}catch(e){history=[]}history.push(order);localStorage.setItem('orderHistory',JSON.stringify(history));localStorage.removeItem('cart');alert('Pesanan berhasil dicatat di browser ini.\nNomor pesanan: '+order.orderId+'\nTotal: '+rupiah(total)+'\n\nPembayaran belum terkonfirmasi.');window.location.href='index.html'});
</script></body></html>
